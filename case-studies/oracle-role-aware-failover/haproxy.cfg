global
    log stdout format raw local0
    stats socket /run/oracle-router/admin.sock mode 600 level admin
    stats timeout 30s

defaults
    log global
    mode tcp
    option tcplog
    timeout connect 5s
    timeout client  5m
    timeout server  5m

frontend oracle_app
    bind 10.20.30.10:1521
    default_backend oracle_rw

backend oracle_rw
    mode tcp
    balance first

    # Fail closed: both backends start disabled and are enabled only
    # after the role selector proves PRIMARY + STANDBY.
    server site_a 172.20.10.10:1521 check inter 3s rise 1 fall 2 disabled
    server site_b 172.20.20.10:1521 check inter 3s rise 1 fall 2 disabled

frontend oracle_health
    bind 10.20.30.10:8405
    mode http

    monitor-uri /health
    acl no_verified_primary nbsrv(oracle_rw) lt 1
    monitor fail if no_verified_primary
